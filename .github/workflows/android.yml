name: Build ZXH OFFICIAL LUDO V2 Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'v2/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Prepare V2 game for Android
        run: |
          mkdir -p www
          cp -R v2/. www/
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          for attempt in 1 2 3 4; do
            echo "Gradle build attempt $attempt/4"
            if ./gradlew assembleDebug --no-daemon --max-workers=2; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "Build failed, likely temporary Maven rate limit. Waiting before retry..."
              sleep $((attempt * 30))
            fi
          done
          exit 1
      - name: Upload V2 APK
        uses: actions/upload-artifact@v4
        with:
          name: ZXH-OFFICIAL-LUDO-V2-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
