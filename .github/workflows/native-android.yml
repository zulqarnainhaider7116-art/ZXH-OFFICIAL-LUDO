name: Build ZXH Native Ludo APK
on:
  push:
    paths: ['native-android/**', '.github/workflows/native-android.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Build native APK
        working-directory: native-android
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ZXH-OFFICIAL-LUDO-NATIVE-APK
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
